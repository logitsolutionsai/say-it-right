[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "say-it-right"
version = "0.2.0"
description = "Make AI voice-overs say every word right, names included: research, lexicon, render, and a three-ear check of every take."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "logitsolutionsai", email = "logitsolutionsai@gmail.com" }]
keywords = ["tts", "text-to-speech", "pronunciation", "ipa", "ssml", "voice-over", "agent-skills"]
dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
    "transformers>=4.56,<5",
    "librosa>=0.10",
    "soundfile>=0.12",
    "num2words>=0.5.13",
    "PyYAML>=6",
]

[project.urls]
Homepage = "https://github.com/logitsolutionsai/say-it-right"
Repository = "https://github.com/logitsolutionsai/say-it-right"
Issues = "https://github.com/logitsolutionsai/say-it-right/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vc = "voicecheck.cli:main"

[tool.setuptools]
packages = ["voicecheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
